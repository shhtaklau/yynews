<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📻 全球广播 · 分类精选</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0c16;
            --bg-secondary: #111427;
            --bg-card: #181d35;
            --bg-card-hover: #21284a;
            --bg-player: #0e1120;
            --text-primary: #f0f2fa;
            --text-secondary: #8a94b8;
            --text-muted: #4a5478;
            --accent: #7c5cfc;
            --accent-light: #b09dff;
            --accent-glow: rgba(124, 92, 252, 0.25);
            --green: #00d4a0;
            --red: #ff5e7a;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 280px;
            height: 280px;
            top: -60px;
            right: -60px;
            background: rgba(124, 92, 252, 0.12);
        }
        .bg-glow-2 {
            width: 200px;
            height: 200px;
            bottom: 200px;
            left: -60px;
            background: rgba(0, 212, 160, 0.06);
        }

        .marquee-wrap {
            position: relative;
            z-index: 100;
            background: rgba(17, 20, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(124, 92, 252, 0.15);
            box-shadow: 0 4px 24px rgba(124, 92, 252, 0.08);
            padding: 8px 0;
            overflow: hidden;
            flex-shrink: 0;
        }

        .marquee-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            padding: 0 12px;
        }

        .marquee-link {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
            color: var(--accent-light);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.3s;
        }

        .marquee-link:hover {
            color: #ffffff;
        }

        .marquee-link span {
            display: inline-block;
            padding-right: 50px;
        }

        .marquee-link .badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-left: 8px;
            color: #ffffff;
            transition: opacity 0.2s;
            box-shadow: 0 2px 16px var(--accent-glow);
        }

        .marquee-link .badge:hover {
            opacity: 0.85;
        }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        @media (max-width: 640px) {
            .marquee-content { font-size: 0.68rem; gap: 6px; }
            .marquee-link .badge { padding: 2px 10px; font-size: 0.6rem; }
        }

        .header {
            position: relative;
            z-index: 2;
            padding: 16px 20px 8px;
            flex-shrink: 0;
            background: linear-gradient(180deg, var(--bg-primary) 50%, transparent);
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
        }
        .header-title .icon {
            font-size: 24px;
        }
        .header-title span {
            background: linear-gradient(135deg, var(--accent-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-badge {
            font-size: 11px;
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: 20px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }
        .header-badge .num {
            color: var(--accent-light);
            font-weight: 700;
        }

        .search-box {
            position: relative;
            z-index: 2;
            padding: 0 20px 10px;
            flex-shrink: 0;
        }
        .search-box input {
            width: 100%;
            padding: 10px 18px 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--bg-card);
        }
        .search-box .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .search-box .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: none;
            padding: 4px;
        }
        .search-box .clear-btn.show {
            display: block;
        }

        .category-tabs {
            padding: 0 16px 12px;
            flex-shrink: 0;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            position: relative;
            z-index: 2;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .category-tabs .tab {
            display: inline-block;
            padding: 6px 16px;
            margin-right: 8px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid transparent;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        .category-tabs .tab:active {
            transform: scale(0.94);
        }
        .category-tabs .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .station-list-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px;
            position: relative;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding-bottom: 10px;
        }

        .station-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px 12px 12px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            touch-action: manipulation;
        }
        .station-card:active {
            transform: scale(0.96);
        }
        .station-card .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .station-card .meta {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .station-card .meta .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .station-card .meta .type {
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 9px;
            color: var(--text-secondary);
        }
        .station-card .playing-badge {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 9px;
            color: var(--green);
            animation: pulse-dot 1.2s infinite;
        }
        .station-card.playing {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .station-card.playing .name {
            color: var(--accent-light);
        }
        .station-card.playing .playing-badge {
            display: block;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .emoji {
            font-size: 44px;
            display: block;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 15px;
        }

        .player-bar {
            position: sticky;
            bottom: 0;
            z-index: 10;
            background: var(--bg-player);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px 16px calc(8px + var(--safe-bottom));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.5);
        }
        .player-bar .inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-bar .info {
            flex: 1;
            min-width: 0;
        }
        .player-bar .info .name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar .info .status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
        }
        .player-bar .info .status .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red);
            display: inline-block;
            animation: pulse-dot 1.5s infinite;
        }
        .player-bar .info .status .live-dot.playing {
            background: var(--green);
        }
        .player-bar .controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .player-bar .controls button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .player-bar .controls button:active {
            transform: scale(0.88);
        }
        .player-bar .controls .play-btn {
            background: var(--accent);
            color: #fff;
            font-size: 24px;
            width: 48px;
            height: 48px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .player-bar .controls .play-btn.playing {
            background: var(--green);
            box-shadow: 0 4px 20px rgba(0, 212, 160, 0.3);
        }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            max-width: 85%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 420px) {
            .station-list { gap: 8px; }
            .station-card { padding: 10px 10px 10px; min-height: 50px; }
            .station-card .name { font-size: 13px; }
            .header-title { font-size: 18px; }
            .player-bar .controls .play-btn { width: 42px; height: 42px; font-size: 20px; }
            .player-bar .controls button { width: 34px; height: 34px; font-size: 16px; }
            .category-tabs .tab { font-size: 12px; padding: 5px 12px; }
        }

        @media (min-width: 600px) {
            .station-list { grid-template-columns: 1fr 1fr 1fr; }
            #app {
                border-left: 1px solid rgba(255, 255, 255, 0.03);
                border-right: 1px solid rgba(255, 255, 255, 0.03);
                box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>

    <div class="toast" id="toast"></div>
    <div id="app">
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>

        
        <header class="header">
            <div class="header-top">

        <div class="search-box">

            <button class="clear-btn" id="clearBtn">✕</button>

        <div class="category-tabs" id="categoryTabs"></div>

        <div class="station-list-wrap" id="listWrap">
            <div class="station-list" id="stationList"></div>
        </div>

        <div class="player-bar" id="playerBar">
            <div class="inner">
                <div class="info">
                    <div class="name" id="nowPlaying">未播放</div>
                    <div class="status">
                        <span class="live-dot" id="liveDot"></span>
                        <span id="statusText">空闲</span>
                    </div>
                </div>
                <div class="controls">
                    <button id="prevBtn">⏮</button>
                    <button class="play-btn" id="playBtn">▶</button>
                    <button id="nextBtn">⏭</button>
                </div>
            </div>
        </div>
    </div>

        function parseStations(raw) {
            const lines = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const stationsMap = new Map();
            for (const line of lines) {
                let name = '', url = '';
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 2) {
                    let urlCandidate = parts.slice(1).join(',').trim();
                    const match = urlCandidate.match(/https?:\/\/[^\s,]+/);
                    if (match) url = match[0].split('#')[0];
                    name = parts[0].trim().replace(/\[\s*\]$/, '').replace(/\s*\(.*\)$/, '').trim();
                } else {
                    const match = line.match(/https?:\/\/[^\s,]+/);
                    if (match) {
                        url = match[0].split('#')[0];
                        let before = line.substring(0, match.index).trim();
                        before = before.replace(/[,，、\s]+$/, '').trim();
                        name = before || url.replace(/^https?:\/\//, '').split('/')[0];
                    }
                }
                if (!url || !name) continue;
                if (!stationsMap.has(name)) stationsMap.set(name, { name, urls: [] });
                const station = stationsMap.get(name);
                if (!station.urls.some(u => u.url === url)) {
                    const type = (url.includes('.m3u8') || url.includes('playlist') || url.includes('hls')) ? 'm3u8' : 'mp3';
                    station.urls.push({ url, type });
                }
            }
            const result = [];
            for (const [name, data] of stationsMap) {
                data.urls.sort((a, b) => {
                    const scoreA = (a.url.startsWith('https') ? 1 : 0) + (a.type === 'm3u8' ? 1 : 0);
                    const scoreB = (b.url.startsWith('https') ? 1 : 0) + (b.type === 'm3u8' ? 1 : 0);
                    return scoreB - scoreA;
                });
                result.push({ name: data.name, urls: data.urls, type: data.urls[0].type, id: result.length });
            }
            result.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
            return result;
        }

            const q = searchInput.value.trim().toLowerCase();
            let filtered = allStations;
            if (currentCategory !== '全部') filtered = filtered.filter(s => getCategory(s.name) === currentCategory);
            if (q.length > 0) filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
            currentFiltered = filtered;
            renderList(filtered);
            stationCountEl.textContent = filtered.length;
        }

        function renderList(list) {
            if (list.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><span class="emoji">📡</span><p>没有匹配的电台</p></div>`;
                return;
            }
            let html = '';
            for (const s of list) {
                const isActive = (currentStation && currentStation.id === s.id);
                const typeLabel = s.type === 'm3u8' ? 'HLS' : 'MP3';
                html += `
                    <div class="station-card ${isActive ? 'playing' : ''}" data-id="${s.id}">
                        <div class="name">${escapeHtml(s.name)}</div>
                        <div class="meta">
                            <span class="dot"></span>
                            <span class="type">${typeLabel}</span>
                        </div>
                        <span class="playing-badge">● 播放中</span>
                    </div>`;
            }
            listEl.innerHTML = html;
            listEl.querySelectorAll('.station-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const station = currentFiltered.find(s => s.id === id);
                    if (station) playStation(station);
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setupSearch() {
            searchInput.addEventListener('input', function() {
                clearBtn.classList.toggle('show', this.value.trim().length > 0);
                applyFilters();
            });
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                clearBtn.classList.remove('show');
                applyFilters();
                searchInput.focus();
            });
        }

        function stopAudio() {
            if (hls) { hls.destroy(); hls = null; }
            if (audio) {
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                audio = null;
            }
            isPlaying = false;
            currentUrlIndex = 0;
            updatePlayButton(false);
            updateStatus('已停止', false);
        }

        function playStation(station) {
            if (!station) return;
            if (currentStation && currentStation.id === station.id && audio) {
                togglePlay();
                return;
            }
            stopAudio();
            currentStation = station;
            updatePlayerInfo(station);
            updateActiveCard(station.id);
            currentUrlIndex = 0;
            startPlaybackWithIndex(station, 0);
        }

        function startPlaybackWithIndex(station, urlIndex) {
            if (urlIndex >= station.urls.length) {
                isPlaying = false;
                updatePlayButton(false);
                updateStatus('播放失败', false);
                showToast('⚠️ 所有源均无法播放');
                return;
            }
            const urlObj = station.urls[urlIndex];
            const url = urlObj.url;
            const type = urlObj.type;

            if (audio) { audio.pause(); audio = null; }
            audio = new Audio();
            audio.crossOrigin = null;

            audio.addEventListener('playing', () => {
                isPlaying = true;
                updatePlayButton(true);
                updateStatus('播放中', true);
                showToast('🎵 ' + station.name);
                currentUrlIndex = urlIndex;
            });
            audio.addEventListener('pause', () => {
                if (!audio.ended && !audio.error) {
                    isPlaying = false;
                    updatePlayButton(false);
                    updateStatus('已暂停', false);
                }
            });
            audio.addEventListener('ended', () => {
                isPlaying = false;
                updatePlayButton(false);
                updateStatus('已结束', false);
                stopAudio();
                showToast('⏹ 播放已结束');
            });
            audio.addEventListener('error', (e) => {
                console.warn(`播放失败 (URL索引${urlIndex}):`, url, audio.error);
                if (type === 'm3u8' && !audio._hlsTried && Hls.isSupported()) {
                    audio._hlsTried = true;
                    showToast('📡 尝试HLS引擎...');
                    useHls(url, station, urlIndex);
                } else {
                    const nextIndex = urlIndex + 1;
                    if (nextIndex < station.urls.length) {
                        showToast(`🔄 切换备用源 (${nextIndex + 1}/${station.urls.length})`);
                        startPlaybackWithIndex(station, nextIndex);
                    } else {
                        isPlaying = false;
                        updatePlayButton(false);
                        updateStatus('播放失败', false);
                        showToast('⚠️ 无法播放此电台');
                        stopAudio();
                    }
                }
            });

            updateStatus(`加载中 (${urlIndex + 1}/${station.urls.length})...`, false);
            updatePlayButton(false);
            audio.src = url;
            audio.play().catch(() => {});
        }

        function useHls(url, station, urlIndex) {
            if (hls) hls.destroy();
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                xhrSetup: (xhr, reqUrl) => {
                    xhr.withCredentials = false;
                    if (reqUrl.includes('ls.qingting.fm')) {
                        xhr.setRequestHeader('Referer', 'https://www.qingting.fm/');
                        xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36');
                    }
                }
            });
            hls.loadSource(url);
            hls.attachMedia(audio);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                audio.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (e, data) => {
                if (data.fatal) {
                    console.error('HLS致命错误:', data);
                    const nextIndex = urlIndex + 1;
                    if (nextIndex < station.urls.length) {
                        showToast(`🔄 切换备用源 (${nextIndex + 1}/${station.urls.length})`);
                        startPlaybackWithIndex(station, nextIndex);
                    } else {
                        isPlaying = false;
                        updatePlayButton(false);
                        updateStatus('播放失败', false);
                        showToast('⚠️ 无法播放此电台');
                        stopAudio();
                    }
                }
            });
            updateStatus('加载中 (HLS)...', false);
        }

        function togglePlay() {
            if (!currentStation) {
                if (currentFiltered.length > 0) playStation(currentFiltered[0]);
                return;
            }
            if (!audio) {
                startPlaybackWithIndex(currentStation, currentUrlIndex);
                return;
            }
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play().catch(() => {
                    startPlaybackWithIndex(currentStation, currentUrlIndex);
                });
            }
        }

        function playPrev() {
            if (currentFiltered.length === 0) return;
            const idx = currentFiltered.findIndex(s => s.id === (currentStation ? currentStation.id : -1));
            let targetIdx = (idx - 1 + currentFiltered.length) % currentFiltered.length;
            if (idx === -1) targetIdx = currentFiltered.length - 1;
            playStation(currentFiltered[targetIdx]);
        }

        function playNext() {
            if (currentFiltered.length === 0) return;
            const idx = currentFiltered.findIndex(s => s.id === (currentStation ? currentStation.id : -1));
            let targetIdx = (idx + 1) % currentFiltered.length;
            if (idx === -1) targetIdx = 0;
            playStation(currentFiltered[targetIdx]);
        }

        function updatePlayerInfo(station) {
            nowPlayingEl.textContent = station ? station.name : '未播放';
        }

        function updateStatus(text, playing) {
            statusTextEl.textContent = text;
            liveDot.className = 'live-dot' + (playing ? ' playing' : '');
        }

        function updatePlayButton(playing) {
            playBtn.textContent = playing ? '⏸' : '▶';
            playBtn.classList.toggle('playing', playing);
        }

        function updateActiveCard(activeId) {
            listEl.querySelectorAll('.station-card').forEach(card => {
                card.classList.toggle('playing', parseInt(card.dataset.id) === activeId);
            });
        }

        function init() {
            allStations = parseStations(RAW_DATA);
            const categories = getAllCategories(allStations);
            renderTabs(categories);
            currentFiltered = allStations.slice();
            renderList(currentFiltered);
            stationCountEl.textContent = currentFiltered.length;
            setupSearch();

            playBtn.addEventListener('click', togglePlay);
            prevBtn.addEventListener('click', playPrev);
            nextBtn.addEventListener('click', playNext);

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); togglePlay(); }
                if (e.key === 'ArrowRight') { e.preventDefault(); playNext(); }
                if (e.key === 'ArrowLeft') { e.preventDefault(); playPrev(); }
                if (e.key === 'f' || e.key === 'F') { e.preventDefault(); searchInput.focus(); }
            });

            if (allStations.length > 0) {
                currentStation = allStations[0];
                updatePlayerInfo(currentStation);
                renderList(currentFiltered);
            }

            if (window.location.protocol === 'https:') {
                console.warn('当前页面通过HTTPS加载，部分HTTP电台流可能因混合内容被浏览器阻止。建议使用HTTP部署或更换为HTTPS源。');
            }

            console.log('📻 全球广播已启动，共 ' + allStations.length + ' 个电台');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
